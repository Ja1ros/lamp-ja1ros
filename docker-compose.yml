name: lamp-ja1ros

services:
    db:
        image: ${DB_IMAGE:-mysql:8.0}
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:?Ejecuta bash iniciar.sh y revisa .env}
            MYSQL_USER: ${MYSQL_USER:?Ejecuta bash iniciar.sh y revisa .env}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta bash iniciar.sh y revisa .env}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta bash iniciar.sh y revisa .env}
            MYSQL_ROOT_HOST: localhost
        volumes:
            - ./dump:/docker-entrypoint-initdb.d:ro
            - ./conf:/etc/mysql/conf.d:ro
            - persistent:/var/lib/mysql
        networks:
            - backend
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                  MYSQL_PWD="$$MYSQL_PASSWORD"
                  $(command -v mariadb || command -v mysql)
                  --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE"
                  -e "SELECT 1" >/dev/null
            start_period: 60s
            interval: 10s
            timeout: 5s
            retries: 5

    www:
        build: 
            context: .
            args:
                PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
                PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-30}
                PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-20M}
                PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-20M}
        restart: unless-stopped
        environment:
            MYSQL_HOST: db
            MYSQL_DATABASE: ${MYSQL_DATABASE:?Ejecuta bash iniciar.sh y revisa .env}
            MYSQL_USER: ${MYSQL_USER:?Ejecuta bash iniciar.sh y revisa .env}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta bash iniciar.sh y revisa .env}
        ports: 
            - "${APACHE_BIND:-0.0.0.0}:${APACHE_PORT:-32868}:80"
        volumes:
            # Read-only is the safe default (your app cannot mutate its own
            # source). If your application writes to disk at runtime (uploads,
            # cache, compiled templates, logs), change ":ro" to ":rw" or mount
            # only the writable sub-paths.
            - ./www:/var/www/html:ro
        depends_on:
            db:
                condition: service_healthy
        networks:
            - frontend
            - backend
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 10s
            timeout: 5s
            retries: 5

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        restart: unless-stopped
        environment:
            PMA_HOST: db
            UPLOAD_LIMIT: ${PHP_UPLOAD_MAX_FILESIZE:-20M}
        ports:
            - "${PHPMYADMIN_BIND:-127.0.0.1}:${PHPMYADMIN_PORT:-32869}:80"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - frontend
            - backend
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    frontend:
        driver: bridge
    backend:
        driver: bridge
        internal: true

volumes:
    persistent:
